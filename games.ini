; Game catalogue: which of these examples are games (and demos) and how to
; run each one on its own. The web emulator on geekychris.github.io
; (gitwebsite's tools/games/package.js) builds the games listed here and
; puts each on a floppy whose volume is named DH2, with the program and its
; data files in DH2:Dev/ and the program started from there, so the games'
; DH2:Dev/, PROGDIR: and relative paths all find their data.
; atari_st_games/games.ini is the same list for the Atari ports.
;
; Each section is one game; its name is the id (the example's directory).
;   title        name shown in the list
;   dir          example directory, relative to this file
;   program      the executable make builds in <dir> (ARCH=m68k)
;   files        data files the program opens at run time, relative to
;                <dir>, space-separated; they go beside the program
;   machine      emulated machine: a1200 (AGA, 68020, 2 MB chip + 8 MB
;                fast; every example is built with -m68020)
;   screenshot   image shown in the list, relative to <dir> (PNG, optional)
;   description  one or more lines of text (indent continuation lines)
;   controls     the same
;   notes        anything else worth knowing (optional)
;   web          no: leave it out of the web emulator (vAmiga with the AROS
;                ROM), with the reason in a comment
;
; Games that save (high scores, the guest list) write beside the program,
; so keep their disk writable.

[uranus_lander]
title = Uranus Lander
dir = uranus_lander
program = uranus_lander
files = uranus.mod
machine = a1200
screenshot = docs/screen.png
description = Land on the pads of Uranus without running out of fuel.
    ProTracker music and sound effects on Paula.
controls = Cursor left/right, A/D or joystick: rotate
    Space, W, cursor up, joystick up or fire: thrust (and start)
    High-score entry: up/down change letter, Space or fire: next letter
    M: music on/off, Esc: quit

